name: million
description: MILLION movie and drama streaming app in Duhok Badini Kurdish.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  video_player: ^2.9.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6

flutter:
  uses-material-design: true
  fonts:
    - family: Speda
      fonts:
        - asset: assets/fonts/Speda-Bold.ttf
          weight: 700
